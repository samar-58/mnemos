name: Mnemos

options:
  bundleIdPrefix: dev.mnemos
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Mnemos:
    type: application
    platform: macOS
    sources:
      - path: macos/Mnemos
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: Accelerate.framework
      - sdk: NaturalLanguage.framework
      - sdk: Network.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mnemos.app
        PRODUCT_NAME: Mnemos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mnemos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Mnemos is a regular app, not a background agent: it owns a main window
        # people work in, so it gets a Dock icon and its own menu bar. The menu
        # bar extra stays as the quick way in. Capture survives the window being
        # closed because the MenuBarExtra keeps the app alive.
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - MnemosTests
      gatherCoverageData: true
  MnemosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macos/MnemosTests
    dependencies:
      - target: Mnemos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mnemos.tests
        GENERATE_INFOPLIST_FILE: YES
